name: maintain

# Keeps every repo in the org current. Weekly, for each repo it finds, this
# opens one pull request that updates flake.lock and another that updates the
# pinned Actions. The pull requests come from the baskingspot GitHub App, so
# the commits are signed and the repo's own CI runs on them.
#
# The App's ID is the org variable APP_CLIENT_ID. Its private key is the secret
# APP_PRIVATE_KEY, limited to this repo.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Limit the run to one repo, by name.
        type: string
        required: false
  schedule:
    # Monday 05:23 UTC.
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  discover:
    # Skip quietly until the App is set up.
    if: vars.APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      # Read-only on purpose: listing the org's repos needs a token that sees all of them.
      - name: Mint a read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read
      - name: Find the repos and what each one needs
        id: find
        run: |
          set -euo pipefail
          include='[]'
          repos=$(gh api --paginate "orgs/${OWNER}/repos?type=all&per_page=100" \
            --jq '.[] | select((.archived | not) and (.fork | not)) | .name')
          for repo in $repos; do
            if [ -n "${ONLY}" ] && [ "${repo}" != "${ONLY}" ]; then
              continue
            fi
            if gh api "repos/${OWNER}/${repo}/contents/flake.lock" > /dev/null 2>&1; then
              include=$(jq -c --arg r "${repo}" '. + [{repo: $r, task: "flake"}]' <<< "${include}")
            fi
            if gh api "repos/${OWNER}/${repo}/contents/.github/workflows" > /dev/null 2>&1; then
              include=$(jq -c --arg r "${repo}" '. + [{repo: $r, task: "pins"}]' <<< "${include}")
            fi
          done
          echo "matrix=${include}" >> "${GITHUB_OUTPUT}"
          echo "${include}" | jq .
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ inputs.repo }}

  update:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    name: ${{ matrix.task }} ${{ matrix.repo }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      # Two token steps, so the pin job alone gets the workflows permission.
      - name: Mint a token to update flake.lock
        id: token-flake
        if: matrix.task == 'flake'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - name: Mint a token to update pinned Actions
        id: token-pins
        if: matrix.task == 'pins'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
          path: target
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: Update flake.lock
        if: matrix.task == 'flake'
        working-directory: target
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee "${RUNNER_TEMP}/body.md"
      - name: Update pinned Actions
        if: matrix.task == 'pins'
        working-directory: target
        run: |
          set -euo pipefail
          # Three days of trailing age, so a hijacked tag has time to be caught.
          nix develop ../tools --command pinact run --update --min-age 3
          echo "Pins every Action in .github/workflows to the newest release that is at least three days old." > "${RUNNER_TEMP}/body.md"
        env:
          GITHUB_TOKEN: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
          path: target
          sign-commits: true
          delete-branch: true
          branch: ${{ matrix.task == 'flake' && 'maintain/flake-lock' || 'maintain/action-pins' }}
          commit-message: "${{ matrix.task == 'flake' && 'flake.lock: update inputs' || 'ci: update pinned actions' }}"
          title: "${{ matrix.task == 'flake' && 'flake.lock: update inputs' || 'ci: update pinned actions' }}"
          body-path: ${{ runner.temp }}/body.md
          labels: |
            dependencies
            automated
