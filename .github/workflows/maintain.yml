name: maintain

# Keeps every repo in the org current. Weekly, for each repo it finds, this
# updates flake.lock and the pinned Actions. A change must pass the repo's own
# `just ci` first. Then it lands on the default branch as one signed commit from
# the baskingspot GitHub App. There are no pull requests. A change that fails
# `just ci` is not pushed, and the run fails so the failure shows in Actions.
#
# The App's ID is the org variable APP_CLIENT_ID. Its private key is the secret
# APP_PRIVATE_KEY, limited to this repo. If a repo protects its default branch,
# the App must be a bypass actor in that ruleset.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Limit the run to one repo, by name.
        type: string
        required: false
  schedule:
    # Monday 05:23 UTC.
    - cron: "23 5 * * 1"

permissions: {}

# One run at a time, so two runs cannot race to push the same repo.
concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  discover:
    # Skip quietly until the App is set up.
    if: vars.APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      # Read-only on purpose: listing the org's repos needs a token that sees all of them.
      - name: Mint a read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read
      - name: Find the repos and what each one needs
        id: find
        run: |
          set -euo pipefail
          include='[]'
          repos=$(gh api --paginate "orgs/${OWNER}/repos?type=all&per_page=100" \
            --jq '.[] | select((.archived | not) and (.fork | not)) | .name')
          for repo in $repos; do
            if [ -n "${ONLY}" ] && [ "${repo}" != "${ONLY}" ]; then
              continue
            fi
            if gh api "repos/${OWNER}/${repo}/contents/flake.lock" > /dev/null 2>&1; then
              include=$(jq -c --arg r "${repo}" '. + [{repo: $r, task: "flake"}]' <<< "${include}")
            fi
            if gh api "repos/${OWNER}/${repo}/contents/.github/workflows" > /dev/null 2>&1; then
              include=$(jq -c --arg r "${repo}" '. + [{repo: $r, task: "pins"}]' <<< "${include}")
            fi
          done
          echo "matrix=${include}" >> "${GITHUB_OUTPUT}"
          echo "${include}" | jq .
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ inputs.repo }}

  update:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    name: ${{ matrix.task }} ${{ matrix.repo }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      # One repo's failure must not stop the others. max-parallel 1 keeps the
      # runs in order, so the log reads one repo at a time.
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      # Two token steps, so the pin job alone gets the workflows permission.
      - name: Mint a token to update flake.lock
        id: token-flake
        if: matrix.task == 'flake'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
      - name: Mint a token to update pinned Actions
        id: token-pins
        if: matrix.task == 'pins'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
          path: target
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: baskingspot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Update flake.lock
        if: matrix.task == 'flake'
        working-directory: target
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee "${RUNNER_TEMP}/body.md"
          echo "flake.lock: update inputs" > "${RUNNER_TEMP}/headline.txt"
      - name: Update pinned Actions
        if: matrix.task == 'pins'
        working-directory: target
        run: |
          set -euo pipefail
          # Three days of trailing age, so a hijacked tag has time to be caught.
          nix develop ../tools --command pinact run --update --min-age 3 2>&1 | tee "${RUNNER_TEMP}/pinact.log"
          echo "Pins every Action in .github/workflows to the newest release that is at least three days old." > "${RUNNER_TEMP}/body.md"
          echo "ci: update pinned actions" > "${RUNNER_TEMP}/headline.txt"
        env:
          GITHUB_TOKEN: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
      - name: Check for changes
        id: changed
        working-directory: target
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to update."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            git diff --stat
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run the repo's CI
        if: steps.changed.outputs.changed == 'true'
        working-directory: target
        run: nix develop --command just ci
      - name: Push one signed commit
        if: steps.changed.outputs.changed == 'true'
        working-directory: target
        # GitHub's createCommitOnBranch API signs the commit as the App.
        run: |
          set -euo pipefail
          branch=$(git branch --show-current)
          head=$(git rev-parse HEAD)
          additions='[]'
          while IFS= read -r path; do
            additions=$(jq -c --arg p "${path}" --arg c "$(base64 -w0 "${path}")" \
              '. + [{path: $p, contents: $c}]' <<< "${additions}")
          done < <(git diff --name-only)
          jq -n \
            --arg repo "${REPO}" --arg branch "${branch}" --arg head "${head}" \
            --arg headline "$(cat "${RUNNER_TEMP}/headline.txt")" \
            --arg body "$(cat "${RUNNER_TEMP}/body.md")" \
            --argjson additions "${additions}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: $headline, body: $body },
                fileChanges: { additions: $additions },
                expectedHeadOid: $head
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'
        env:
          GH_TOKEN: ${{ steps.token-flake.outputs.token || steps.token-pins.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
