name: release-library

# Tags a library release and opens the GitHub release. A library ships source
# only: no binary, no attestation, no install channel.
#
# This workflow changes no files and makes no commit. The changelog section and
# the version in build.zig.zon are prepared beforehand, committed and signed by
# a person, and this tags that commit. `release-prep.py` does the preparation.
#
# The caller is a `workflow_dispatch` with a `version` input and
# `contents: write`; see the README.

on:
  workflow_call:
    inputs:
      version:
        description: The version without the leading v, such as 0.2.0. The changelog must already have a `## [X.Y.Z]` section, and build.zig.zon must name it.
        type: string
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version and the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "${VERSION}"; then
            echo "version must look like 0.2.0, got ${VERSION}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists" >&2
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no \`## [${VERSION}]\` section; run release-prep.py first" >&2
            exit 1
          fi
          if ! grep -Eq "^[[:space:]]*\.version = \"${VERSION}\"" build.zig.zon; then
            echo "build.zig.zon does not name version ${VERSION}" >&2
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "the ${VERSION} section is empty" >&2
            exit 1
          fi

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/v${VERSION}" --field sha="$(git rev-parse HEAD)" > /dev/null

      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
