name: release

# The one way baskingspot publishes a program. A caller runs it on a v* tag:
#
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       uses: baskingspot/gh-actions/.github/workflows/release.yml@COMMIT # vX.Y.Z
#       secrets:
#         CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
#         APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
#
# What it does, in order:
#   1. Runs the repo's CI (.github/ci.yaml). A release never ships from red.
#   2. Builds every platform in .github/release.yaml, with
#      `just release-build TARGET DIR`, and bundles each one the way the org
#      dictates: BINARY-TAG-ASSET.tar.gz, or .zip for Windows, holding one
#      folder with the program and the LICENSE.
#   3. Writes SHA256SUMS, attests the archives, and creates the GitHub release.
#      The notes are docs/releases/TAG.md if the repo has it, else the commits
#      since the previous tag, and an install section follows either way.
#   4. Writes a Homebrew cask, installs it on Homebrew on Linux and macOS and
#      runs the program, and only then commits it to baskingspot/homebrew-tap
#      as the norm App. The tap holds nothing but casks.
#
# release.yaml has `binary`, and optionally `platforms`, a list from linux-x64,
# linux-arm64, macos-arm64, and windows-x64. The default is the first three.
# Windows ships as a zip and nothing else. Another channel is another job after
# `publish`. The caller needs
# APP_PRIVATE_KEY and the variable APP_CLIENT_ID for step 4: both are org
# values that a repo is added to when it ships a program.
on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Write token for the baskingspot Cachix cache. Optional.
        required: false
      APP_PRIVATE_KEY:
        description: The norm App's private key, for the commit to the tap.
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      binary: ${{ steps.plan.outputs.binary }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release.yaml
          sparse-checkout-cone-mode: false
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          config=$(yq -o=json '.' .github/release.yaml)
          binary=$(jq -er '.binary | select(type == "string")' <<< "${config}")
          jq -e '[keys[]] | unique - ["binary", "platforms", "requires"] | length == 0' <<< "${config}" > /dev/null \
            || { echo "release.yaml has an unknown top-level key" >&2; exit 1; }
          matrix=$(jq -c '
            {"linux-x64": "x86_64-linux-musl", "linux-arm64": "aarch64-linux-musl",
             "macos-arm64": "aarch64-macos", "windows-x64": "x86_64-windows"} as $triples
            | (.platforms // ["linux-x64", "linux-arm64", "macos-arm64"]) as $platforms
            | if ($platforms | type) != "array" or ($platforms | length) == 0 then error("platforms must be a non-empty list") else . end
            | [ $platforms[] | . as $p
                | if $triples[$p] == null then error("unknown platform: " + $p) else {asset: $p, target: $triples[$p]} end ]
          ' <<< "${config}")
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | "\(.asset) from \(.target)"' <<< "${matrix}"

  ci:
    needs: plan
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build:
    needs: [plan, ci]
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: baskingspot
          extraPullNames: mattrobenolt
          skipPush: true
      - name: Build into a prefix
        # The repo's recipe installs the program under stage/bin.
        run: nix develop --command just release-build "$TARGET" stage
        env:
          TARGET: ${{ matrix.target }}
      - name: Bundle
        uses: baskingspot/gh-actions/actions/package@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
        with:
          binary: ${{ needs.plan.outputs.binary }}
          tag: ${{ github.ref_name }}
          asset: ${{ matrix.asset }}
          dir: stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the attestation is signed with the workflow's identity
      attestations: write
    outputs:
      description: ${{ steps.meta.outputs.description }}
      homepage: ${{ steps.meta.outputs.homepage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read the tags and the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        # No zip when a program does not ship Windows, so an empty glob is fine.
        run: |
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        uses: baskingspot/gh-actions/actions/release-notes@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
        with:
          tag: ${{ github.ref_name }}
          repo: ${{ github.event.repository.name }}
      - name: Create the release
        run: gh release create "${TAG}" dist/* --repo "${REPO}" --title "${TAG}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
      - name: The repo's About text, for the cask
        id: meta
        run: |
          gh api "repos/${REPO}" --jq '"description=\(.description // "")\nhomepage=\(if (.homepage // "") == "" then .html_url else .homepage end)"' >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Write the cask
        uses: baskingspot/gh-actions/actions/render-cask@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
        with:
          repo: ${{ github.event.repository.name }}
          tag: ${{ github.ref_name }}
          sums: dist/SHA256SUMS
          description: ${{ steps.meta.outputs.description }}
          homepage: ${{ steps.meta.outputs.homepage }}
          out: cask/${{ github.event.repository.name }}.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cask
          path: cask/*.rb
          if-no-files-found: error

  check-cask:
    needs: publish
    name: cask on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cask
          path: cask
      - name: Find Homebrew
        run: |
          if [ -d /home/linuxbrew/.linuxbrew/bin ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "${GITHUB_PATH}"
          fi
      - name: Put the cask in a local tap
        run: |
          brew --version
          brew tap-new --no-git baskingspot/check
          mkdir -p "$(brew --repository baskingspot/check)/Casks"
          cp cask/*.rb "$(brew --repository baskingspot/check)/Casks/"
      - name: Style
        run: brew style baskingspot/check
      - name: Audit (informational)
        continue-on-error: true
        run: |
          for cask in cask/*.rb; do
            brew audit --cask "baskingspot/check/$(basename "${cask}" .rb)"
          done
      - name: Install the cask and run the program
        run: |
          for cask in cask/*.rb; do
            name=$(basename "${cask}" .rb)
            brew install --cask "baskingspot/check/${name}"
            # The binary stanza names the program, as folder/program.
            binary=$(sed -n 's|^ *binary ".*/\(.*\)"$|\1|p' "${cask}" | head -n 1)
            path="$(brew --prefix)/bin/${binary}"
            test -x "${path}"
            "${path}" --help > /dev/null
            if [ "$(uname)" = Darwin ]; then
              # The postflight step must have removed the quarantine flag.
              if xattr -p com.apple.quarantine "${path}" 2> /dev/null; then
                echo "${path} is still quarantined" >&2
                exit 1
              fi
            fi
          done

  tap:
    needs: [publish, check-cask]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Mint a token for the tap
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cask
          path: cask
      - name: Commit the cask to the tap
        # GitHub's createCommitOnBranch API signs the commit as the App. A
        # second program releasing at the same moment moves the tap's head, so
        # a stale head is retried.
        run: |
          set -euo pipefail
          file=$(ls cask/*.rb)
          name=$(basename "${file}")
          tap="${OWNER}/homebrew-tap"
          if existing=$(gh api "repos/${tap}/contents/Casks/${name}" --jq .content 2> /dev/null) \
            && [ "$(base64 -d <<< "${existing}")" = "$(cat "${file}")" ]; then
            echo "The tap already has this cask."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            head=$(gh api "repos/${tap}/git/ref/heads/main" --jq .object.sha)
            if jq -n \
              --arg repo "${tap}" --arg head "${head}" \
              --arg headline "casks: ${name%.rb} ${TAG}" \
              --arg path "Casks/${name}" --arg contents "$(base64 -w0 "${file}")" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  message: { headline: $headline },
                  fileChanges: { additions: [{ path: $path, contents: $contents }] },
                  expectedHeadOid: $head
                } }
              }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'; then
              exit 0
            fi
            echo "Attempt ${attempt} failed. Retrying." >&2
            sleep $(( attempt * 3 ))
          done
          echo "Could not commit to the tap." >&2
          exit 1
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
